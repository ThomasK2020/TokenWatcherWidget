# Configuration dynamique des ports, profils Hermes, efficacité énergétique et quotas — TokenWatcher V4.2.4
services:
  proxy:
    host: "127.0.0.1"
    port: 13306
    unit: "lemonade-opencode-proxy.service"
  vulkan:
    host: "127.0.0.1"
    port: 8001
    slots_endpoint: "/slots"
    metrics_endpoint: "/metrics"
  lemonade_admin:
    host: "127.0.0.1"
    port: 13305
    health_endpoint: "/api/v1/health"
  vllm_rocm:
    host: "127.0.0.1"
    port: 8000
    metrics_endpoint: "/metrics"
    models_endpoint: "/v1/models"
  open_webui:
    host: "127.0.0.1"
    port: 8080
  ollama:
    host: "127.0.0.1"
    port: 11434
    ps_endpoint: "/api/ps"

hermes:
  # "auto" résout automatiquement le profil le plus récemment actif (ou env HERMES_PROFILE)
  # include_all_profiles: true agrège tous les profils (~/.hermes/profiles/* + default) sans perte inter-profils
  active_profile: "auto"
  include_all_profiles: true
  active_session_window_sec: 120
  max_sessions: 25

cloud_quotas:
  default:
    label: "Cloud API"
    tpm_ceiling: 2000000
    rpm_ceiling: 1000
    rpd_ceiling: 10000
  models:
    "gemini-4-hydrogen":
      label: "Hydrogen"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000
    "gemini-4-argon":
      label: "Argon"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000
    "gemini-*-flash-lite*":
      label: "Flash-Lite"
      tpm_ceiling: 4000000
      rpm_ceiling: 4000
      rpd_ceiling: 40000
    "gemini-flash-lite*":
      label: "Flash-Lite"
      tpm_ceiling: 4000000
      rpm_ceiling: 4000
      rpd_ceiling: 40000
    "gemini-*-flash*":
      label: "Flash"
      tpm_ceiling: 4000000
      rpm_ceiling: 2000
      rpd_ceiling: 20000
    "gemini-flash*":
      label: "Flash"
      tpm_ceiling: 4000000
      rpm_ceiling: 2000
      rpd_ceiling: 20000
    "gemini-*pro*":
      label: "Pro"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000

ipc:
  state_file: "/tmp/tokenwatcher_widget_state.json"
  polling_interval_sec: 1.0

efficiency:
  electricity_eur_per_kwh: 0.20
  discrete_ref_tok_per_j: 0.28
  discrete_ref_label: "GPU discret 300W (~0.28 tok/J)"

power:
  # "auto" = auto-calibré sur les fenêtres calmes (par platform_profile), sinon fallback
  # ou un nombre (ex: 13.5) pour forcer un talon manuel.
  # Le démon tourne déjà toutes les 1,0 s et connaît gpu_busy_pct, cpu_busy_pct,
  # l'activité des moteurs locaux (slots_active, running_reqs) et l'état batterie (status == "Discharging").
  # Dès qu'il observe une fenêtre de vrai repos sur batterie (ex. GPU <= 5%, CPU <= 15%,
  # aucun moteur en génération pendant >= 15-30 s), il capture le percentile bas / médian de BAT*/power_now.
  # Cette valeur est mise en cache sur disque (ex. ~/.cache/tokenwatcher/power_baseline.json)
  # indexée par profil ACPI (/sys/firmware/acpi/platform_profile : low-power, balanced, performance).
  idle_baseline_watts: "auto"
  fallback_idle_watts: 12.0
  idle_max_gpu_busy_pct: 5
  idle_max_cpu_busy_pct: 15
  idle_min_window_sec: 15
  baseline_cache_file: "~/.cache/tokenwatcher/power_baseline.json"

