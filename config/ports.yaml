# Configuration dynamique des ports, profils Hermes et quotas par modèle — TokenWatcher V4.2.0
services:
  proxy:
    host: "127.0.0.1"
    port: 13306
    unit: "lemonade-opencode-proxy.service"
  vulkan:
    host: "127.0.0.1"
    port: 8001
    slots_endpoint: "/slots"
    metrics_endpoint: "/metrics"
  lemonade_admin:
    host: "127.0.0.1"
    port: 13305
    health_endpoint: "/api/v1/health"
  vllm_rocm:
    host: "127.0.0.1"
    port: 8000
    metrics_endpoint: "/metrics"
    models_endpoint: "/v1/models"
  open_webui:
    host: "127.0.0.1"
    port: 8080
  ollama:
    host: "127.0.0.1"
    port: 11434
    ps_endpoint: "/api/ps"

hermes:
  # "auto" résout automatiquement le profil le plus récemment actif (ou env HERMES_PROFILE)
  # Mettre include_all_profiles: true pour agréger tous les profils (~/.hermes/profiles/* + default)
  active_profile: "auto"
  include_all_profiles: false
  active_session_window_sec: 120
  max_sessions: 15

cloud_quotas:
  default:
    label: "Cloud API"
    tpm_ceiling: 2000000
    rpm_ceiling: 1000
    rpd_ceiling: 10000
  models:
    "gemini-4-hydrogen":
      label: "Hydrogen"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000
    "gemini-4-argon":
      label: "Argon"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000
    "gemini-*-flash-lite*":
      label: "Flash-Lite"
      tpm_ceiling: 4000000
      rpm_ceiling: 4000
      rpd_ceiling: 40000
    "gemini-flash-lite*":
      label: "Flash-Lite"
      tpm_ceiling: 4000000
      rpm_ceiling: 4000
      rpd_ceiling: 40000
    "gemini-*-flash*":
      label: "Flash"
      tpm_ceiling: 4000000
      rpm_ceiling: 2000
      rpd_ceiling: 20000
    "gemini-flash*":
      label: "Flash"
      tpm_ceiling: 4000000
      rpm_ceiling: 2000
      rpd_ceiling: 20000
    "gemini-*pro*":
      label: "Pro"
      tpm_ceiling: 2000000
      rpm_ceiling: 1000
      rpd_ceiling: 10000

ipc:
  state_file: "/tmp/tokenwatcher_widget_state.json"
  polling_interval_sec: 1.0

inference_routing:
  cloud_hosts:
    - "googleapis.com"
    - "generativelanguage.googleapis.com"
